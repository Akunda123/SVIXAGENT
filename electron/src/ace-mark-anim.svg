<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <!-- ══ ACE 皮肤的 orb 标记（第三套皮肤）══
       来源：**用户自绘**（2026-10-03 提供 `Downloads\SVG\资源 112312132.svg`，Illustrator 默认导出名）。
       ⚠️ 按用户要求改造过（**字形几何一笔未改**，三条 d 属性原样搬运）：
         · **去掉底**：黑方底、方框细边、a 的圆心点、2px 小点全删 ⇒ 只剩字母、背景**透明**
           （a 的圆孔本来就画在字形路径里，去底后露出的是透明，形状照样正确）
         · **字母白色填充**（c/e 显式 fill:#fff；他原图白字在白底上看不见，所以看着"没有颜色"）
         · **字母 a 用 #9087f6 描边 + 填充**（stroke-width 2px，沿用他原图那份的量级）
       ⚠️ **动画与 sv-monogram-anim / instrumentx-mark-anim 同款**（用户 2026-10-03：「动画也和 sv 一样」）：
           逐条「描边描出 → 填充」，1s ease-in，延迟 6/13/20ms。
           dasharray = **浏览器量出来的真实路径长 ×1.05**（a 780→820 / c 714→750 / e 770→809）——
           ⚠️ 换素材/换缩放时**必须重量**（长度不够会画成虚线，太长则动画前段被吃掉）。
           量法：把 path 塞进浏览器调 `path.getTotalLength()`（无头 Edge 截图读数字即可，见交接文档 §17.4）
       ⚠️ 原始文件仍在 `Downloads\SVG\资源 112312132.svg`（要回去看底/边就翻它）
       槽位契约（换图时保持）：文件名 electron/src/ace-mark-anim.svg · viewBox 正方形 · 球 56px 里按 width:36px 显示
       ⚠️ XML 注释里**不许出现连续两个连字符**（踩过一次：整份 SVG 解析失败、图是空的）
       自查：node tools/check-ace-status.cjs -->
  <defs>
    <style>
      /* ⚠️ 基色写在类上（同 SV/IX）：动画延迟期/降级时也能出正确颜色 */
      .ace-a { fill: #9087f6; stroke: #9087f6; stroke-linejoin: round; stroke-linecap: round; stroke-width: 2px; }
      .ace-rest { fill: #fff; stroke: #fff; stroke-linejoin: round; stroke-linecap: round; stroke-width: 0.5px; }

      /* 1. ace-a（字母 a）：路径长 780 → dash 820 */
      #p1{ animation: ace1 1s ease-in 0.006s forwards; }
      @keyframes ace1 { 0% { fill: transparent; stroke: #9087f6; stroke-dasharray: 820px; stroke-dashoffset: 820px; } 20% { stroke-dashoffset: 0; } 30% { fill: transparent; } 50% { stroke: #9087f6; fill: #9087f6; } 100% { stroke: #9087f6; fill: #9087f6; } }
      /* 2. ace-rest（字母 c）：路径长 714 → dash 750 */
      #p2{ animation: ace2 1s ease-in 0.013s forwards; }
      @keyframes ace2 { 0% { fill: transparent; stroke: #fff; stroke-dasharray: 750px; stroke-dashoffset: 750px; } 20% { stroke-dashoffset: 0; } 30% { fill: transparent; } 50% { stroke: #fff; fill: #fff; } 100% { stroke: #fff; fill: #fff; } }
      /* 3. ace-rest（字母 e）：路径长 770 → dash 809 */
      #p3{ animation: ace3 1s ease-in 0.020s forwards; }
      @keyframes ace3 { 0% { fill: transparent; stroke: #fff; stroke-dasharray: 809px; stroke-dashoffset: 809px; } 20% { stroke-dashoffset: 0; } 30% { fill: transparent; } 50% { stroke: #fff; fill: #fff; } 100% { stroke: #fff; fill: #fff; } }
    </style>
  </defs>
