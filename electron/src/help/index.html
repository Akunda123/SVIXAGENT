<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKDAgent 使用说明 · 用对话操作 Synthesizer V Studio / Instrument X</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     SVAgent 演示页（给用户看的一版：左侧显示全部条目）

     左 = 圆环「最右边那一段弧」+ v2 标题节点
          同时显示 VISIBLE 条；条目比窗口多时靠滚轮 / 拖动上下滑动
          当前条目对应的弧上指示点随圆弧旋转；可折叠
     右 = 当前节的标题 + **这一节自己的**功能按钮（按钮做大）+ 悬停细节
          （不再一次铺 44 个按钮）
     配色：SV2 主题值（取自预设编辑器 body[data-theme="sv2"]）
     背景：同目录 bg.png（相对路径）
     改内容只改底部 DEMO 配置；
     改「左侧显示几条 / 多大」只改 VISIBLE / SPRED / ARC / 那一行几何常量
     —— 录制版（rec.html）就是这份文件换这几个常量生成的，见 tools/gen-demo-rec.cjs
     ══════════════════════════════════════════════════════════════ */
  :root{
    --sv-bg:#232325; --sv-panel:#2d2b2e; --sv-input:#3c3a3d; --sv-disabled:#343235;
    --sv-border:#343235; --sv-border-strong:#3c3a3d;
    --sv-active:#ebe1ec; --sv-active-text:#232325;
    --sv-note:#7eb12e; --sv-text:#ffffff; --sv-muted:rgba(255,255,255,.78);
    --sv-body:rgba(255,255,255,.90);
    --arcw:min(44vw,640px);   /* 左弧列宽。2026-09-25：44vw/640px（原 48vw/700px）；
                                 rec.html 由 gen-demo-rec.cjs 覆写成 30vw（录制版左右三七分） */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--sv-bg);color:var(--sv-text);overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}

  /* ── 背景 ── */
  #bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
  body.has-img #bgimg{display:block}
  #scrim{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(120% 105% at 50% 50%, rgba(35,35,37,.16) 0%, rgba(35,35,37,.58) 72%, rgba(35,35,37,.86) 100%),
      linear-gradient(180deg, rgba(35,35,37,.40) 0%, rgba(35,35,37,.08) 42%, rgba(35,35,37,.50) 100%)}

  /* ── 舞台：左弧 / 右主体 ── */
  .stage{position:relative;z-index:1;height:100%;display:grid;
    grid-template-columns:var(--arcw) 1fr}
  @media (max-width:1000px){
    .stage{grid-template-columns:1fr;grid-template-rows:46% 1fr}
    :root{--arcw:100%}
  }

  /* 左：圆环最右段 + 横条（钉在屏幕左侧，占满整高） */
  .arc{position:relative;min-width:0;display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;touch-action:none}
  .arc.grab{cursor:grabbing}
  .arc svg{display:block;width:100%;height:100%;overflow:visible}
  /* ⚠️ 2026-09-25 用户：「把 class="svgwrap" 收窄」——**只收窄这个盒子本体**（列宽 --arcw 不动），
     里面的 svg 是 inset:0 + width/height:100% ⇒ 图按比例缩小、四周留白，正文列宽不受影响。
     rec.html 由 gen-demo-rec.cjs 生成，**同样收窄**（用户 2026-09-25：「改 rec」）。 */
  .svgwrap{position:relative;flex:1 1 auto;min-height:0;margin-top:4px;width:88%;margin-inline:auto}
  .svgwrap svg{position:absolute;inset:0;width:100%;height:100%}
  .rail{fill:none;stroke:var(--sv-border-strong);stroke-width:2.5}
  /* 滚动是逐帧算的（见 draw/step）⇒ 这里不能再挂 CSS 过渡，否则两边打架、拖尾 */
  .prog{fill:none;stroke:var(--sv-note);stroke-width:3.5;stroke-linecap:round;opacity:.9}
  /* 滚动动画期间把所有颜色过渡关掉：条目是在固定的几个 DOM 节点之间「换内容」的，
     换的那一刻高亮会在两行之间交叉淡入淡出 ⇒ 看着就是「滚完闪一下」 */
  body.gliding .bar, body.gliding .node,
  body.gliding .btxt, body.gliding .bnum{transition:none}
  .stick{cursor:pointer}
  .node{fill:var(--sv-bg);stroke:var(--sv-border-strong);stroke-width:2.5;
    transition:stroke .26s, stroke-width .26s}
  .bar{fill:rgba(56,54,57,.95);stroke:var(--sv-border-strong);stroke-width:1;transition:fill .26s,stroke .26s}
  .stick:hover .bar{fill:var(--sv-input)}
  .stick:hover .node{stroke:var(--sv-muted)}
  .stick.on .bar{fill:var(--sv-active);stroke:var(--sv-active)}
  .stick.on .node{stroke:var(--sv-note);stroke-width:4}
  .btxt{fill:var(--sv-text);font-weight:400;dominant-baseline:middle;transition:fill .26s}
  .bnum{fill:var(--sv-note);dominant-baseline:middle;transition:fill .26s}
  .stick.on .btxt{fill:var(--sv-active-text);font-weight:600}
  .stick.on .bnum{fill:var(--sv-active-text);opacity:.55}
  /* ⚠️ 必须 :not(.on)：.stick.sub .bar 排在 .stick.on .bar 后面，
     同特异度时后者胜 ⇒ 当前条目恰好是小节（§3.x）时，白底会被这条盖成暗底、
     深色文字就跟着看不见了（实测踩过） */
  .stick.sub:not(.on) .bar{fill:rgba(48,46,49,.92)}
  /* ⚠️ 这里**不能**再用 CSS 定字号：给 `.stick.sub .btxt` 写 font-size 会盖掉 JS 设在元素上的
     font-size 属性，而 em 的基准是文档的 16px ⇒ 小节行被焊死在 13.76px（无论 FONT 调多大；
     实测踩过：章行 44px、节行 13.76px）。小节的字号改由 draw() 里按 FONT × SUB_FONT 算。 */
  /* 弧上那个「随当前条目旋转」的指示点（位置逐帧算，所以不带 CSS 过渡） */
  .knob{fill:var(--sv-note);stroke:var(--sv-bg);stroke-width:3}
  .knobdot{fill:var(--sv-bg)}
  /* 面板顶 / 底 / 折叠后的边条（角上的提示字已按用户要求删掉，只留 brand） */
  .nav-top{display:flex;align-items:center;justify-content:flex-end;gap:10px;
    padding:14px 16px 0 0;min-height:36px;z-index:2}
  .navtoggle{width:26px;height:26px;padding:0;border-radius:6px;cursor:pointer;
    background:var(--sv-panel);border:1px solid var(--sv-border-strong);color:var(--sv-muted);
    font-family:inherit;font-size:13px;line-height:1;transition:background .16s,color .16s,border-color .16s}
  .navtoggle:hover{background:var(--sv-input);color:var(--sv-text);border-color:var(--sv-note)}
  .nav-side{display:none}
  body.nav-collapsed .stage{grid-template-columns:44px 1fr}
  body.nav-collapsed .svgwrap{display:none}
  body.nav-collapsed .nav-top{justify-content:center;padding:14px 0 0}
  body.nav-collapsed .nav-side{display:flex;flex:1 1 auto;align-items:center;justify-content:center;
    padding-bottom:14px;cursor:pointer;font-size:12px;letter-spacing:4px;color:var(--sv-muted)}
  body.nav-collapsed .nav-side span{writing-mode:vertical-rl}
  body.nav-collapsed .nav-side:hover{color:var(--sv-text)}

  /* 右：主体 = 当前节标题 + 这一节的功能按钮 + 悬停细节
     ⚠️ 2026-09-25：内容**不许被裁**（原来 .body 写死 max-height:430px ⇒ 备注/长表格被切掉，
        看着像"md 里的东西没同步进来"）。现在：正文全铺开 + **整个右栏可滚**；
        居中用 `justify-content:safe center` —— 放得下时居中、放不下时自动当 flex-start（不裁顶）。
        （试过 .inner{margin-block:auto}：**滚动容器里 auto 外边距不吸收剩余空间** ⇒ 短内容贴顶，作废。） */
  .pane{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
    overflow-y:auto;overscroll-behavior:contain;
    padding:0 clamp(24px,4vw,72px) 5vh;min-width:0;text-shadow:0 1px 4px rgba(0,0,0,.55)}
  .pane::before{content:"";position:absolute;left:0;top:5%;bottom:5%;border-left:1px dashed rgba(255,255,255,.14)}
  .pane::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(255,255,255,.07)}
  .inner{position:relative;display:flex;flex-direction:column;align-items:center;
    text-align:center;gap:18px;max-width:min(1040px,100%)}
  /* 换节过渡：右栏整块淡入 + 轻微上移（paint() 每次换节重新触发；快速连滚不重启；REDUCE 下不触发） */
  .inner.enter{animation:contentIn .26s cubic-bezier(.22,.61,.36,1) both}
  @keyframes contentIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* 当前节：节号 + 节标题 +（章条目才有）说明 —— 整条占满右栏宽度 */
  .crumb{position:relative;align-self:stretch;width:100%;text-align:center;pointer-events:none}
  .crumb .num{font-size:14px;letter-spacing:3px;color:var(--sv-note)}
  .crumb h2{margin:5px 0 0;font-size:clamp(32px,4.6vh,54px);font-weight:600;letter-spacing:.5px}
  .crumb .desc{margin:11px 0 0;font-size:16.5px;line-height:1.65;color:var(--sv-body)}

  /* 功能按钮：一次只铺当前节的几个 ⇒ 可以做大 */
  .chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-top:2px}
  .chip{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:10px;
    background:rgba(52,50,53,.94);border:1px solid var(--sv-border-strong);font-size:18.5px;line-height:1.25;
    white-space:nowrap;transition:background .16s,border-color .16s,transform .16s;cursor:pointer;outline:none}
  .chip .ic{color:var(--sv-note);font-size:18.5px}
  .chip:hover{background:var(--sv-input);border-color:var(--sv-note);transform:translateY(-1px)}
  .chip:focus-visible{border-color:var(--sv-note)}
  .chip.on{background:var(--sv-active);border-color:var(--sv-active);color:var(--sv-active-text);transform:translateY(-1px)}
  .chip.on .ic{color:var(--sv-note)}
  /* 悬停细节：做大 —— 这是「这一节在干什么」的唯一正文字，别抠门 */
  .tip{margin:0;align-self:stretch;font-size:17px;line-height:1.75;color:var(--sv-body);min-height:5.4em;
    max-width:min(1040px,100%);text-align:left;border:1px solid var(--sv-border);border-radius:10px;
    background:rgba(45,43,46,.66);padding:15px 20px 17px}
  .tip[hidden]{display:none}          /* 没有 tip 的节（章条目）整块收起来，不留空框 */
  .tip b{color:var(--sv-text);font-weight:400;font-size:18px}
  .tip .th{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
  .tip .tag{font-size:11.5px;color:var(--sv-note);letter-spacing:1px;border:1px solid var(--sv-border-strong);
    border-radius:4px;padding:0 6px;line-height:1.5}
  .tip .tb{display:block}

  /* 正文区：该节除按钮外的全部内容 —— 表格 / 有序步骤 / 备注 / 段落 / 代码块（md 里原样搬过来）
     ⚠️ **不设 max-height、不自己滚**：内容全部铺开，超长时由 .pane 整体滚（否则会被裁掉一截） */
  .body{align-self:stretch;width:100%;max-width:min(1040px,100%);text-align:left;margin-top:2px;
    padding:12px 16px;
    background:rgba(28,28,30,.66);border:1px solid var(--sv-border);border-radius:12px;backdrop-filter:blur(3px)}
  .body[hidden]{display:none}
  .body p{margin:0 0 10px;font-size:16.5px;line-height:1.7;color:var(--sv-body)}
  .body ol{margin:0;padding-left:28px;font-size:16.5px;line-height:1.7;color:var(--sv-body)}
  .body ol li{margin:0 0 6px}
  /* 文案列表（非条目的 `- ` 行，如 §2.2「与侧栏面板同步」、§3.9 那条 ⚠️ 告警） */
  .body ul{margin:0;padding-left:26px;font-size:16.5px;line-height:1.7;color:var(--sv-body)}
  .body ul li{margin:0 0 6px}
  .body blockquote{margin:0 0 10px;padding:10px 15px;border-left:3px solid var(--sv-note);
    background:rgba(52,50,53,.72);border-radius:0 8px 8px 0;font-size:15.5px;line-height:1.7;color:var(--sv-body)}
  /* 代码块：等宽 + 横向可滚（页面里目前只当"非图解"的兜底，图解见下面的 .flow） */
  .body pre{margin:0 0 10px;padding:12px 14px;background:rgba(28,27,30,.85);border:1px solid var(--sv-border-strong);
    border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.45;
    color:var(--sv-body);overflow-x:auto;white-space:pre}
  /* §2.1 关系图（图解）：md 里那段 ASCII 是给 GitHub 看的，页面里画成流程卡
     （用户 2026-09-25：「2.1 的 body 换成图解」） */
  .flow{display:flex;flex-direction:column;align-items:stretch}
  .flow .step{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;
    background:rgba(52,50,53,.72);border:1px solid var(--sv-border-strong);border-radius:10px}
  .flow .step .no{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:rgba(126,177,46,.18);color:var(--sv-note);font-size:14px;font-weight:600}
  .flow .step .tx{flex:1 1 auto;min-width:0}
  .flow .step .tt{font-size:16px;font-weight:600;color:var(--sv-text);line-height:1.5}
  .flow .step .sub{margin-top:3px;font-size:14px;line-height:1.65;color:var(--sv-muted)}
  .flow .step .sub code{font-family:ui-monospace,Consolas,monospace;font-size:13px;
    background:rgba(0,0,0,.28);padding:1px 5px;border-radius:5px}
  .flow .step.io{background:rgba(28,27,30,.85);border-style:dashed}
  .flow .arrow{display:flex;justify-content:center;padding:2px 0;font-size:12px;line-height:1;
    color:rgba(255,255,255,.32)}
  .body table{border-collapse:collapse;width:100%;font-size:16.5px}
  .body th,.body td{border:1px solid var(--sv-border-strong);padding:10px 14px;text-align:left;
    vertical-align:top;line-height:1.6}
  .body th{background:rgba(60,58,61,.9);color:var(--sv-text);font-weight:600;white-space:nowrap}
  .body td:first-child{white-space:nowrap;color:var(--sv-text)}
  .body code,.tip code{background:var(--sv-input);border-radius:4px;padding:0 5px;font-size:.92em}
  .tip ul.subs,.tip ol.subs{margin:7px 0 0;padding-left:22px;color:var(--sv-body)}
  .tip ul.subs li,.tip ol.subs li{margin:0 0 4px}
  .tip .tag.todo,.chip.todo{border-color:#6b5a2a}
  .tip .tag.todo{color:#e0b050}
  .chip.todo .ic{color:#e0b050}

  /* ── 角标：只留 brand（其余三角的提示字已删） ── */
  .brand{position:fixed;left:24px;top:20px;z-index:3;display:flex;align-items:baseline;gap:9px;pointer-events:none}
  .brand b{font-size:17px;letter-spacing:.6px}
  .brand span{font-size:12.5px;color:var(--sv-muted)}

  /* ── 窄屏（≤1000px）：左弧挪到上面，标题会变小、只当目录看 ──
     ⚠️ 必须放在上面那些基础规则「之后」：媒体查询不提升优先级，
        同选择器后出现的规则才生效（放在文件前部会被后面的基础规则盖掉） */
  @media (max-width:1000px){
    .pane{justify-content:flex-start;padding:12px 0 3vh}
    .chips{gap:9px}
    .chip{font-size:15px;padding:9px 15px}
    .tip{min-height:0}
  }
</style>
</head>
<body class="no-media">

<img id="bgimg" alt="" src="bg.png">
<div id="scrim"></div>

<div class="brand"><b>AKDAgent</b><span>使用说明</span></div>

<div class="stage">
  <!-- 左：钉在屏幕左侧的弧 —— v2 标题目录；滚轮 / 拖动上下滑动，指示点随圆弧旋转 -->
  <div class="arc" id="arc">
    <div class="nav-top">
      <button class="navtoggle" id="navtoggle" type="button" aria-expanded="true"
              aria-controls="ring" title="折叠 / 展开（快捷键 E）">⟨</button>
    </div>
    <div class="svgwrap">
      <!-- viewBox 左边 180 是空的（弧最左也才到 x≈230）⇒ 裁掉，同样的列宽能大 22% -->
      <svg id="ring" viewBox="180 0 820 1000" preserveAspectRatio="xMidYMid meet" role="listbox"
           aria-label="v2 说明的标题目录">
        <path class="rail" id="rail"></path>
        <path class="prog" id="prog"></path>
        <g id="sticks"></g>
        <g class="knobg" id="knobg"><circle class="knob" r="11"></circle><circle class="knobdot" r="3.6"></circle></g>
      </svg>
    </div>
    <div class="nav-side" id="navside"><span>标题目录</span></div>
  </div>
  <!-- 右：主体区 —— 一个 flex 列（#core）：当前节标题 → 功能按钮 → 悬停细节 → 正文
       ⚠️ 2026-09-25：crumb 原来是 #core 的**兄弟**，于是"没正文/没按钮"的节（章条目、1.4）
         只剩一个 2px 高的空 #core，标题与空区域的间距全靠巧合 ⇒ 把 crumb 并进 #core，
         整个右栏只有**一个**居中子项，间距统一由 #core 的 gap 决定。 -->
  <div class="pane">
    <div class="inner" id="core">
      <div class="crumb" id="crumb"></div>
      <div class="chips" id="chips"></div>
      <div class="tip" id="tip"></div>
      <div class="body" id="body"></div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   只改这里：
     nav   = v2 说明的标题（进左侧弧）
     chips = 各节的功能按钮（c = 属于哪一节，d = hover 出来的原话）
   文案都截自 README-发布版草案-v2.md，不自己编
   ════════════════════════════════════════════════════════════════ */
/* DEMO-DATA:BEGIN —— 由 tools/gen-demo-data.cjs 从 README-发布版草案-v2.md 生成，别手改 */
const DEMO = { nav: [

{"num":"1.1","label":"运行要求","sub":1,"lead":"","items":[],"blocks":[{"t":"table","head":["项","要求"],"rows":[["<b>系统</b>","<b>Windows 10 及以上（64 位）</b>；<b>macOS 11 及以上，Apple Silicon（M 系列芯片）</b>（<b>Intel 机型不支持</b>）"],["<b>宿主</b>","需已安装 <b>Synthesizer V Studio</b>（<b>SV1 / SV2 都支持</b>）或 <b>Instrument X</b>（侧栏面板需要 SV2 / IX 1.0.0 及以上）"],["<b>磁盘</b>","安装包约 <b>380 MB</b>，装完展开约 <b>1 GB</b>（macOS 版同量级）；语音输入模型<b>按需下载、三档可选</b>，另需 <b>0.02～0.22 GB</b>（不装也能用，只是没有语音输入；档位见 §2.4）"]]},{"t":"quote","v":["<b>macOS 看芯片，不看机型</b>：「关于本机」里写 <b>芯片 Apple M…</b>（M1 及之后）就能用；写 <b>处理器 Intel</b> 就不支持。","<b>能用</b>：Apple Silicon（M 系列）—— 2020 年 11 月起的那批；<b>不支持</b>：Intel 机型（2019 年及更早发布的全部 Mac，加上 2020 年的 Intel 型号：27 吋 iMac、13 吋 MacBook Pro、13 吋 MacBook Air）。","原因：ONNX 运行时不提供 Intel(macOS/x86-64) 的二进制；且 Apple 已宣布 <b>macOS 26 是最后一个支持 Intel Mac 的系统</b>。"]}]},
{"num":"1.2","label":"安装","sub":1,"lead":"<b>Windows</b>：","items":[],"blocks":[{"t":"ol","items":["双击 <code>AKDAgent-&lt;版本&gt;-x64.exe</code>（或 <code>.msi</code>），按向导走 —— <b>安装位置可以改</b>，默认装到 <code>%LOCALAPPDATA%\\Programs\\AKDAgent</code>","<b>按用户安装、不需要管理员权限</b>（所以不会弹 UAC）；装完桌面与开始菜单会有快捷方式","启动客户端（启动后桌面上会有<b>悬浮球</b>）"]},{"t":"quote","v":["卸载：控制面板/设置里的「AKDAgent」，或安装目录下的 <code>Uninstall AKDAgent.exe</code>。","<b>卸载器可能会问\"是否删除应用数据\"，选否即可保住设置</b>（<code>%APPDATA%\\AKDAgent</code>）；你自己的 DSH 数据（<code>~/.dsh</code>）不受影响。"]},{"t":"p","v":"<b>macOS</b>："},{"t":"ol","items":["下载 <code>AKDAgent-&lt;版本&gt;-arm64.dmg</code>，双击打开 → 把 <b>AKDAgent</b> 拖进「应用程序」（zip 版也行：解压后同样拖进去）","首次打开：<b>右键 → 打开</b>（安装包<b>未签名/未公证</b> ⇒ 直接双击可能被 Gatekeeper 拦；或在「系统设置 → 隐私与安全性」里点「仍要打开」）","启动后<b>菜单栏</b>会出现图标、桌面上会有<b>悬浮球</b>"]},{"t":"quote","v":["卸载：把「应用程序」里的 <code>AKDAgent.app</code> 拖进废纸篓即可。","你的数据在 <code>~/Library/Application Support/AKDAgent</code>（设置/语音模型）与 <code>~/.dsh</code>（会话），<b>拖走 app 不会删它们</b>。","语音输入首次启用需要<b>授予麦克风权限</b>；未签名的包有时会被系统反复问 —— 在「系统设置 → 隐私与安全性 → 麦克风」里勾上 AKDAgent 即可。"]}]},
{"num":"1.3","label":"配 API 密钥（模型提供方）","sub":1,"lead":"<b>设置 → 模型</b>：选一个提供方，填它的 <b>API 密钥</b>即可用它的模型。","items":[{"n":"内置 DeepSeek 卡片","d":"直接在卡片里的密钥框填入（保存后不会再每次弹窗）"},{"n":"12 个内置预设","d":"（点一下加一张卡片，各自填自己的密钥）：<code>openai</code> · <code>anthropic</code> · <code>google</code> · <code>groq</code> · <code>mistral</code> · <code>openrouter</code> · <code>xai</code> · <code>moonshotai</code> · <code>deepseek</code> · <code>cerebras</code> · <code>together</code> · <code>huggingface</code>"},{"n":"自定义提供方","d":"（<code>+ 添加自定义提供方</code>）：填<b>密钥环境变量名</b> · <b>接口协议</b>（如 <code>openai-completions</code> / <code>anthropic-messages</code>）· <b>服务地址</b>；密钥也可以直接填"}],"blocks":[{"t":"p","v":"<b>如果本机已经装了 DeepSeek Harness（DSH），助手会直接沿用它的密钥与设置</b>，不用再填一遍。"},{"t":"quote","v":["⏳ 待补：截图。"]}]},
{"num":"1.4","label":"把桥部署到宿主","sub":1,"lead":"<b>设置 → SV 集成</b>：添加宿主的 <code>scripts</code> 目录（<b>可以加多个版本</b>，也支持「自动检测」）→ 点「<b>一键部署到全部目录</b>」。 部署会把桥脚本放进该目录的 <code>Agent\\</code> 子目录，并在各 SV 根目录建好工作文件夹。","items":[],"blocks":[]},
{"num":"1.5","label":"启动：打开悬浮球 + 在宿主里运行桥","sub":1,"lead":"","items":[],"blocks":[{"t":"ol","items":["打开<b>悬浮球</b>（桌面常驻）或宿主里的<b>侧栏面板</b> —— 出现「AKDAgent」","在宿主里<b>运行</b> <code>Agent → AKDAgentBridge.lua</code>","面板顶部显示 <b>桥：在跑</b> ⇒ 接通，可以开始对话了"]},{"t":"quote","v":["为什么要手动跑一次：桥跑在宿主内部、负责读写工程与文件，而<b>侧栏面板自己没有文件权限</b>（宿主的安全限制）⇒ <b>面板无法替你启动桥</b>。跑过就一直活着，直到关闭宿主；<b>下次再进宿主还要跑一次</b>。顶部显示\"过期 / 离线\"就是没跑、或跑过又被关掉了。"]}]},

{"num":"2.1","label":"桥（跑在宿主里的脚本）","sub":1,"lead":"<b>桥就是连接宿主与助手的那个脚本</b> —— 助手要读你的工程、要写音符，都得经过它；两侧靠<b>本机文件</b>交换信息（不走网络）。","items":[{"n":"同一时间只支持 1 个","d":"SV + 1 个 IX（见 §4.1）"}],"blocks":[{"t":"pre","v":["① 你说话（悬浮球 / 宿主侧栏面板）","        │","        ▼","② Electron 客户端（悬浮球 · 设置 · 密钥窗）","     ├─ 内嵌 DSH 运行时（node）──► 模型 API：想清楚要调哪个工具","     └─ MCP server（resources/server/dist/index.js，stdio 子进程）","              │","              │ ③ 文件通道（本机 %TEMP%，不走网络）：","              │    akdagent-{req,res,hb,log}-&lt;host&gt;.json","              ▼","④ Lua 桥 AKDAgentBridge.lua —— 跑在宿主里的脚本，轮询取请求","     ├─ 读写工程：音符 / 歌词 / 参数 / 自动化 / 速度标记…","     └─ 侧栏面板：宿主的 SidePanelSection ⇄（project scriptData）⇄ 客户端","              │","              ▼","⑤ 宿主 SV / IX 里的工程"]},{"t":"ul","items":["随安装包分发，在 <b>设置 → SV 集成</b>里<b>一键部署</b>到宿主的 <code>scripts</code> 目录；在宿主里运行后常驻"]}]},
{"num":"2.2","label":"悬浮球（对话窗）","sub":1,"lead":"<b>悬浮球是你平时跟助手对话的窗口</b> —— 常驻桌面，点开即用。","items":[{"n":"支持<b>语音输入</b>","d":"（§2.4）"},{"n":"托盘 / 悬浮球菜单","d":"<b>新会话</b> · <b>隐藏到托盘</b>"}],"blocks":[{"t":"ul","items":["与侧栏面板同步"]}]},
{"num":"2.3","label":"侧栏面板","sub":1,"lead":"<b>侧栏面板是宿主里那块对话面板</b> —— 借用 SV2 / IX 自带的侧边栏：聊天、提问、选项都在里面点，不用切窗口。","items":[{"n":"单选点一下即提交","d":"；<b>多选逐个勾选后再确认</b>；<b>跳过</b> = 让助手自己决定"},{"n":"一次只显示一道题","d":"答完即消失"}],"blocks":[{"t":"ul","items":["信息框 · 输入框 · <b>单选 / 多选选项</b> · 补充说明框 · <b>确认 / 跳过 / 停止 / 刷新</b>"]},{"t":"ul","items":["顶部实时显示 <b>桥 / 悬浮球</b>状态，离线时给\"怎么开\"的提示"]}]},
{"num":"2.4","label":"语音输入","sub":1,"lead":"<b>通过语音快捷输入内容</b>（全程在本机识别，不上传）","items":[{"n":"三档本地模型","d":"<b>轻量 24 MB（中文，边说边出）</b> · <b>标准 200 MB（中英双语，边说边出）</b> · <b>精确 217 MB（中英 + 方言，说完再出，最准）</b>"}],"blocks":[{"t":"ul","items":["设置页可切换、可看下载状态"]}]},
{"num":"2.5","label":"语言（两套，互不影响）","sub":1,"lead":"<b>语言是两套独立设置</b>（都在 <b>设置 → 对话</b>），改一套不会动另一套：","items":[{"n":"客户端界面语言","d":"悬浮球 / 设置窗 / 托盘 / 密钥窗这些<b>客户端界面</b>的文案 —— 四语可选（简体中文 / 繁體中文 / English / 日本語），<b>首次启动按系统语言自动选</b>，设置里随时改"},{"n":"DSH 界面语言","d":"（内嵌 DSH 的 <code>locale.preference</code>）：决定<b>模型回复用哪种语言</b>，以及 DSH 自己的网页界面 —— 与上面的客户端界面语言各管各的"}],"blocks":[]},
{"num":"三","label":"功能","sub":0,"lead":"共 <b>44 项</b>，按主题分 10 类。哪个功能在哪个宿主可用有差异，见 §4.1。","items":[],"blocks":[]},
{"num":"3.1","label":"音频分析处理（含对轨）","sub":1,"lead":"<b>这类帮你读懂音频、并把伴奏和工程对上线</b> —— 速度、调性、和弦、情绪、人声与伴奏分离。","items":[{"n":"分析音频","d":"速度 / 节拍 · 调性 · <b>和弦</b> · <b>情绪</b>（喜 / 宁静 / 愤 / 悲伤 四类）· 音高中位数（可只分析某一段）—— <b>很快</b>：3 分钟的伴奏<b>十秒上下</b>出结果"},{"n":"分离与提取","d":"人声 / 伴奏分离（<b>在你本机跑，不联网</b>，可分成两次各取更干净的一侧 · <b>最慢，约 3 倍音频时长</b>：3 分钟的歌约 9 分钟，两侧都取要跑两遍 ⇒ 差不多翻倍）· 从中提取音符（相当于人声转谱；默认用轻量模型，要更准的可以说一声换更精确的 · 与分离同量级，长曲子建议<b>先只分析某一段</b>或先把音频截短）· 任意音频转 44.1 kHz WAV（纯解码，很快）"},{"n":"对轨","d":"测出速度与<b>第一拍位置</b>，把伴奏轨对齐到小节线（或第一个音符）· 按伴奏的<b>实际速度变化</b>逐段打速度标记（适合速度有漂移的曲子）—— 测速与打标记都很快（同分析类）；⚠️ <b>按实时 BPM 打速度标记依赖 SV2，SV1 上暂不可用</b>"}],"blocks":[]},
{"num":"3.2","label":"工程生成、处理","sub":1,"lead":"<b>这类帮你直接产出工程文件、或直接改工程文件</b> —— 不必开着宿主也能做（宿主开着时也照样做）。","items":[{"n":"直接生成工程文件","d":"内部包含了完整的 <code>.svp</code>、<code>.ixp</code> 数据结构，可以根据结构生成新的工程。"},{"n":"直接编辑工程文件","d":"api 做不到的部分功能，可以直接通过修改工程实现。"},{"n":"导入乐谱","d":"（MusicXML）：把现成的<b>乐谱搬进工程</b> —— 音符 / 时值 / 歌词按谱面落进去，<b>技法与力度也照谱面标注映射</b>；谱面自带的速度<b>只做汇报、不自动套用</b>；复调（多声部 / 和弦）默认拒绝（会算错音位），确要导再显式说明"}],"blocks":[]},
{"num":"3.3","label":"音符编辑","sub":1,"lead":"<b>针对\"手工做很烦、或索性做不到\"的编辑</b> —— 按条件挑、整批套同一规则、要算相对关系的。 （单纯移调那种两个快捷键就完事的，助手当然也能做，但那不是这一节的意思。）","items":[{"n":"按条件挑音符再动手","d":"（条件说一声即可，助手在宿主里<b>一趟跑完</b>）：","subs":["「把时值短于 16 分音符的都拉长到 16 分」","「超出这条轨音域的音全部整八度挪进来」","「这几段的参数（响度 / 张力 / 气声…）按第一段对齐」"]},{"n":"整批套同一规则","d":"多条轨 / 多个组 / 整段范围一次做完 —— 手工要点很多遍，还容易漏"}],"blocks":[]},
{"num":"3.4","label":"旋律和和声","sub":1,"lead":"<b>这类帮你写旋律，也给已有旋律配和声</b> —— 从零生成一段，或复核你写好的一段。","items":[{"n":"生成旋律","d":"给调性 / 情绪 / 和弦进行 / 小节数即可；内含<b>动机发展、分句与气口、句末终止、单一高点、强拍落和弦内音</b>；可选伴奏琶音，能导出 <code>.mid</code>"},{"n":"复核旋律","d":"不留气口 / 六度以上大跳 / 单音重复 / 大段短音符 等判据，出一份<b>建议清单</b>"},{"n":"生成和声","d":"按主旋律 + 伴奏调性生成三度 / 六度等和声部，写进新组或新轨"}],"blocks":[]},
{"num":"3.5","label":"歌词","sub":1,"lead":"<b>这类帮你把词安到音符上，并检查唱出来会不会怪</b> —— 对位填词，外加倒字 / 谐音 / 韵脚 / 词格的复查。","items":[{"n":"对位 / 填词","d":"中文逐字、英文按词；有 LRC 时间戳时可按时间对齐；也可整轨写入，可以通过sv自带的音频转录辅助对轨填词"},{"n":"歌词复核","d":"<b>倒字</b>（旋律走向与字调不合）· <b>谐音</b>（容易听成别的字）· <b>韵脚</b>（首句漏押 / 段内换韵 / 虚字充韵脚）· <b>词格</b>（字数与音符数是否对得上）"},{"n":"辅助歌词生成","d":"给主题 / 情绪 / 风格（或结合已有旋律的字数与气口）写一版词 —— 段落结构、押韵、意象与词格按规范来；写完直接接上面的对位填词落进工程，不用来回换工具"},{"n":"歌词怎么填","d":"（按你手上的材料选一条）：","subs":["<b>有 LRC 时间戳</b> ⇒ 按时间把字对到对应音符上","<b>只有干声 / 伴奏音频</b> ⇒ 先从音频<b>提取一条参考轨</b>（音符的起止与音高），再照它把词逐字对上去","<b>什么参考都没有</b> ⇒ 直接把词给助手，它先按现有音符顺序 / 小节给你一版，你再改"],"subOl":1}],"blocks":[]},
{"num":"3.6","label":"音素咬字（含说唱专项）","sub":1,"lead":"<b>这类帮你抠唱出来的细节</b> —— 辅音收边、音素替换、混合语种、说唱的声调与重音。","items":[{"n":"读宿主的计算结果","d":"音高曲线 · 说唱的重音与语调 · 每个音实际用的语种（宿主一次算不完，助手会<b>自动等它算完</b>）"},{"n":"音素候选","d":"某个字唱得不对（糊、含糊、尾音怪）时，助手按<b>这个音符实际在用的语种</b>给出<b>可替换的音素</b>——元音按\"同族\"、辅音按\"发音相近\"排，<b>只给最像的几个</b>（该语种里没有相近的会<b>如实说明</b>，而不是硬凑）"},{"n":"批量替换音素","d":"把一批音符的音素按规则换掉（例如某段里统一把 <code>u</code> 换成 <code>U</code>，或把某个辅音换成更清晰的写法）；<b>默认只给计划、不写工程</b>，你确认后才落盘，写完会<b>逐音回读</b>","subs":["<b>清单外的音素直接拒写</b>（避免写出唱不出来的音；不同语种/声库的写法差异助手会提示）","⚠️ <b>只想改一个音素、却要跨语种</b>时，助手会提醒你<b>先把那个音符拆成两个</b> —— 因为<b>改语种会让这个音符的全部音素重算</b>"]},{"n":"辅音收边","d":"短音符后面那个音的起首辅音容易\"吃掉\"前一个音 ⇒ 助手扫出来并给收边方案，<b>默认只预览不写</b>"},{"n":"混合语种","d":"一首歌里混了多种语言时，按语义判断并<b>只改少数派</b>音符的语种，<b>默认只预览不写</b>"},{"n":"说唱专项","d":"按<b>词</b>判定普通话声调（多音字按词定音），逐音符写入说唱重音，<b>默认只预览不写</b>"}],"blocks":[]},

/* ══ 左侧弧：只有圆环「最右边」的一段 ══
   圆心在画布左侧外（CX<0），右侧只露出很浅的一段弧 —— 就是 PPT 那个形状
   条子只建 VISIBLE 个「槽位」，每次重绘换内容 ⇒ 条目在窗口里上下滑动
   条目少的时候把 SPRED 收窄（间距变大）、NODE_R/BAR_H/FONT 放大即可 */
const SVGNS = 'http://www.w3.org/2000/svg';
const CX = -494, CY = 500, R = 854;      // 圆心 / 半径（viewBox 坐标）
const SPRED = 30;                        // 可见条目分布在 ±SPRED°（窗口半角）
const ARC = 32;                          // 弧画到 ±ARC°，比节点略长一点
const NODE_R = 14, BAR_H = 30, BAR_RIGHT = 980, FONT = 20, NUM_FONT = 14, TXT_GAP = 38, LABEL_MAX = 27;
const VISIBLE = 18;                      // ← 左侧同时显示几条（18 = 全部显示）
const SUB_FONT = 0.92;                   // 小节行字号 = FONT × 这个（**在 JS 里算**，别用 CSS em）

const NAV = DEMO.nav, N = NAV.length, V = Math.min(VISIBLE, N), HALF = Math.max(0, (V - 1) / 2);
const WINDOWED = N > V;                  // 条目比窗口多 ⇒ 窗口滑动、远条目变淡
const INDENT = NODE_R;                   // 小节条目往右缩一格，看得出层级
const isSection = num => /^\d+(?:\.\d+)?$/.test(num);   // '3.3' ⇒ 功能节；'三' / '◆' ⇒ 章
/* 开局落在 §3.1（md 里第一个功能节） */
const START = NAV.findIndex(c => c.num === '3.1');
let cur = START >= 0 ? START : 0;

const pt = deg => { const a = deg * Math.PI / 180; return [CX + R * Math.cos(a), CY + R * Math.sin(a)]; };
const arcPath = (a0, a1) => { const [x0,y0] = pt(a0), [x1,y1] = pt(a1);
  return `M ${x0} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y1}`; };
const el = (n, a, txt) => { const e = document.createElementNS(SVGNS, n);
  for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
const sepOf = n => /^[一二三四五六七八九十]$/.test(n) ? '、' : ' ';
/* 连续槽位坐标 x → 弧度（x = 0 是窗口第一格，可以是小数 ⇒ 才有"滑"的效果）*/
const PITCH = 2 * SPRED / (V - 1 || 1);
const slotDeg = x => -SPRED + PITCH * x;
const topOf = q => Math.min(Math.max(q - HALF, 0), Math.max(0, N - V));   // 窗口顶端的连续位置
/* 滑出窗口的两端淡掉（0 = 完全出去）。0.6 ≈ 滑到窗口外半个身位就没了 ——
   留太远（原来 0.9）会在 viewBox 边缘露出一截被切掉的行（实测录屏时会闪一下半截行） */
const edgeFade = x => x < 0 ? Math.max(0, 1 + x / 0.6)
                   : x > V - 1 ? Math.max(0, 1 - (x - (V - 1)) / 0.6) : 1;
let p = cur;                              // 平滑后的位置（滚动动画的真相；cur 是目标）

document.getElementById('rail').setAttribute('d', arcPath(-ARC, ARC));

/* 弧上节点：比窗口多建两条 —— 滚动时才有条目从窗口外滑进来/滑出去 */
const ROWS = Math.min(N, V + 2);
const gSticks = document.getElementById('sticks');
const rows = [];
for (let k = 0; k < ROWS; k++){
  const g = el('g', { class: 'stick', role: 'option' });
  g.append(el('rect', { class: 'bar' }), el('text', { class: 'bnum' }),
           el('text', { class: 'btxt' }), el('circle', { class: 'node' }));
  g.addEventListener('click', () => { const i = Number(g.dataset.i); if (Number.isFinite(i)) go(i); });
  gSticks.appendChild(g);
  rows.push({ g, bar: g.children[0], bnum: g.children[1], btxt: g.children[2], node: g.children[3] });
}

/* ══ 右侧：当前节 = md 里的那一节 ══
   标题 + 导语；顶层条目 → 大按钮（hover 出全文）；章条目 → 它的各小节当按钮（点了跳过去）；
   其余内容（表格 / 有序步骤 / 备注 / 段落）→ 正文区 */
const ICON = { '3.1':'♫', '3.2':'⌘', '3.3':'✎', '3.4':'♪', '3.5':'⌗',
               '3.6':'◍', '3.7':'〰', '3.8':'≈', '3.9':'◈', '3.10':'▤' };
const crumbBox = document.getElementById('crumb');
const chipBox  = document.getElementById('chips');
const tipBox   = document.getElementById('tip');
const bodyBox  = document.getElementById('body');
let chips = [], items = [];

/* 章条目底下接着的小节（用于把章的内容列成一排可点的按钮） */
function childrenOf(i){
  const out = [];
  for (let k = i + 1; k < N && NAV[k].sub; k++) out.push(k);
  return out;
}

function showItem(i){
  const it = items[i]; if (!it) return;
  chips.forEach(ch => ch.classList.toggle('on', +ch.dataset.i === i));
  const subs = (it.subs && it.subs.length)
    ? (it.subOl ? `<ol class="subs">${it.subs.map(s => `<li>${s}</li>`).join('')}</ol>`
                : `<ul class="subs">${it.subs.map(s => `<li>${s}</li>`).join('')}</ul>`)
    : '';
  tipBox.innerHTML =
    `<span class="th"><b>${it.n}</b>${it.todo ? '<span class="tag todo">待补</span>' : ''}</span>` +
    (it.d ? `<span class="tb">${it.d}</span>` : '') + subs;
}

/* ⏳ 待补的条目 / 备注 / 表行：演示页里先隐藏（用户 2026-09-24：「待补先隐藏」）
   ⚠️ 只在渲染时藏 —— 页面数据必须与 md 逐字节一致（守卫会比对），所以数据里一条不动 */
const HIDE_TODO = true;
/* 章条目（一 / 二 / 三 / 四）要不要把它底下的各小节列成一排 chip？
   用户 2026-09-24：「章标题的 chip 删掉，只留一个标题」⇒ 关掉。要放回来改成 true。 */
const CHAPTER_CHIPS = false;

/* ── §2.1 的图解（用户 2026-09-25：「2.1 的 body 换成图解」）─────────────────────
   md 里那段 ``` 的 ASCII 图**留着**（GitHub 上得能看），页面里换成这张流程卡。
   ⚠️ 两份必须对得上：`t` 取 ASCII 每步 ①～⑤ 后面的标题，守卫 check-demo-page 会逐条比对，
      改一边不改另一边会 FAIL。 */
const FLOW = [
  { no: '①', t: '你说话', sub: '悬浮球 / 宿主的侧栏面板' },
  { no: '②', t: 'Electron 客户端（悬浮球 · 设置 · 密钥窗）',
    sub: '内嵌 DSH 运行时（node）──► 模型 API：想清楚要调哪个工具<br>' +
         'MCP server（<code>resources/server/dist/index.js</code>，stdio 子进程）' },
  { no: '③', t: '文件通道（本机 %TEMP%，不走网络）', io: 1,
    sub: '<code>akdagent-{req,res,hb,log}-&lt;host&gt;.json</code>' },
  { no: '④', t: 'Lua 桥 AKDAgentBridge.lua',
    sub: '跑在宿主里的脚本，轮询取请求 —— 读写工程：音符 / 歌词 / 参数 / 自动化 / 速度标记…<br>' +
         '侧栏面板：宿主的 SidePanelSection ⇄（project scriptData）⇄ 客户端' },
  { no: '⑤', t: '宿主 SV / IX 里的工程', sub: '' },
];
function renderFlow(){
  return '<div class="flow">' + FLOW.map(function (f, i) {
    return (i ? '<div class="arrow">▼</div>' : '') +
      '<div class="step' + (f.io ? ' io' : '') + '">' +
        '<span class="no">' + f.no + '</span>' +
        '<div class="tx"><div class="tt">' + f.t + '</div>' +
          (f.sub ? '<div class="sub">' + f.sub + '</div>' : '') +
        '</div>' +
      '</div>';
  }).join('') + '</div>';
}

/* 正文：表格 / 有序步骤 / 备注（引用）/ 段落 / 图解 —— md 里除顶层条目之外的内容都在这儿 */
function renderBlock(b){
  const isTodo = v => HIDE_TODO && /^⏳/.test(String(v).trim());
  if (b.t === 'table'){
    /* 任一格是「⏳ …」就算这行整体还是待补（md 的表是「项 | 做法」两列，⏳ 落在做法列） */
    const rows = HIDE_TODO ? b.rows.filter(r => !r.some(isTodo)) : b.rows;
    if (!rows.length) return '';
    return `<table><thead><tr>${b.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>` +
      rows.map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
  }
  if (b.t === 'ol') return `<ol>${b.items.map(v => `<li>${v}</li>`).join('')}</ol>`;
  /* 文案列表（md 里那些"不是条目"的 `- ` 行：纯句子 / ⚠️ 告警 / 名词串）——
     用户 2026-09-25：「分清 md 里是条目还是文本注释，不要所有行都放 chip 里」 */
  if (b.t === 'ul') return `<ul>${b.items.map(v => `<li>${v}</li>`).join('')}</ul>`;
  /* 代码块：ASCII 图（md 里那段）在页面里换成图解；非图解的代码块仍按等宽渲染 */
  if (b.t === 'pre') return /^①/.test(String(b.v[0]).trim()) ? renderFlow() : `<pre>${b.v.join('\n')}</pre>`;
  if (b.t === 'quote') return isTodo(b.v[0]) ? '' : `<blockquote>${b.v.join('<br>')}</blockquote>`;
  if (b.t === 'p') return isTodo(b.v) ? '' : `<p>${b.v}</p>`;
  return '';
}

/* 换一整节 */
function renderSection(i){
  const c = NAV[i];
  const lead = (c.lead && !(HIDE_TODO && /^⏳/.test(c.lead.trim()))) ? c.lead : '';
  crumbBox.innerHTML = `<span class="num">${isSection(c.num) ? '§' + c.num : c.num}</span>` +
    `<h2>${c.label}</h2>` + (lead ? `<p class="desc">${lead}</p>` : '');

  items = [];
  /* 章条目：关掉 CHAPTER_CHIPS 之后**只留标题**（不再把各小节列成按钮，tip 也随之自动收起） */
  if (CHAPTER_CHIPS && !c.sub) for (const k of childrenOf(i))
    items.push({ n: NAV[k].num + ' ' + NAV[k].label, d: NAV[k].lead || '', go: k });
  for (const it of (c.items || [])) items.push(it);
  if (HIDE_TODO) items = items.filter(it => !it.todo);

  chipBox.innerHTML = items.map((it, k) =>
    `<span class="chip${it.todo ? ' todo' : ''}" data-i="${k}" tabindex="0" role="button">` +
    `<span class="ic">${ICON[c.num] || '•'}</span>${it.n}</span>`).join('');
  chips = [...chipBox.querySelectorAll('.chip')];
  chips.forEach(ch => { const k = +ch.dataset.i;
    const jump = items[k] && items[k].go;
    ch.addEventListener('mouseenter', () => showItem(k));
    ch.addEventListener('focus',      () => showItem(k));
    ch.addEventListener('click',      () => jump != null ? go(jump) : showItem(k));
  });

  /* 没有条目的节（只有表格 / 步骤 / 纯说明）⇒ 细节框整块收起来 */
  if (items.length){ tipBox.hidden = false; showItem(0); }
  else { tipBox.hidden = true; tipBox.innerHTML = ''; }

  bodyBox.innerHTML = (c.blocks || []).map(renderBlock).join('');
  bodyBox.hidden = !bodyBox.innerHTML;
  bodyBox.scrollTop = 0;
}

/* ══ 画一帧（按连续位置 p）—— 条目沿弧滑动，滑出窗口的两端淡掉 ══ */
const progEl = document.getElementById('prog'), knobEl = document.getElementById('knobg');
function draw(){
  const top = topOf(p), cursor = p - top;     // cursor = 指示点所在的连续格（中间恒为 HALF）
  const i0 = Math.floor(top) - 1;
  rows.forEach((s, k) => {
    const idx = i0 + k, c = NAV[idx], x = idx - top;
    if (!c || x < -1.6 || x > V + 0.6){       // 窗口外：收起来，也别接点击
      s.g.style.opacity = 0;
      s.g.style.pointerEvents = 'none';
      delete s.g.dataset.i;
      return;
    }
    const [bx, by] = pt(slotDeg(x));
    const x0 = bx + (c.sub ? INDENT : 0), on = idx === cur;
    s.bar.setAttribute('x', x0.toFixed(1));
    s.bar.setAttribute('y', (by - BAR_H / 2).toFixed(1));
    s.bar.setAttribute('width', (BAR_RIGHT - x0).toFixed(1));
    s.bar.setAttribute('height', BAR_H);
    s.bar.setAttribute('rx', Math.max(3, Math.round(BAR_H / 12)));
    s.bnum.setAttribute('x', (x0 + TXT_GAP).toFixed(1));
    s.bnum.setAttribute('y', by.toFixed(1));
    s.bnum.setAttribute('font-size', NUM_FONT);
    const numTxt = c.num + sepOf(c.num);
    if (s.bnum.textContent !== numTxt) s.bnum.textContent = numTxt;
    s.btxt.setAttribute('x', (x0 + TXT_GAP + NUM_FONT * 2.1).toFixed(1));
    s.btxt.setAttribute('y', by.toFixed(1));
    /* 字号跟着 FONT 走：小节只按 SUB_FONT 缩一点点（**不能**交给 CSS 的 em，见上面那条注释） */
    s.btxt.setAttribute('font-size', (c.sub ? FONT * SUB_FONT : FONT).toFixed(1));
    /* 弧上只放得下这么多字（LABEL_MAX 随字号 / 条宽走）：长的截断，全文在右边标题里 */
    const cp = [...c.label];
    const txt = cp.length > LABEL_MAX ? cp.slice(0, LABEL_MAX - 1).join('') + '…' : c.label;
    if (s.btxt.textContent !== txt) s.btxt.textContent = txt;
    s.node.setAttribute('cx', bx.toFixed(1));
    s.node.setAttribute('cy', by.toFixed(1));
    s.node.setAttribute('r', NODE_R);
    s.g.dataset.i = idx;
    s.g.style.pointerEvents = '';
    s.g.classList.toggle('on', on);
    s.g.classList.toggle('sub', !!c.sub);
    s.g.setAttribute('aria-selected', on ? 'true' : 'false');
    /* 越靠窗口边越淡 × 离指示点越远越淡（最淡不低于 .30，否则换节时那条会整条看不见） */
    const op = edgeFade(x) * (WINDOWED ? Math.max(0.55, 1 - 0.18 * Math.abs(x - cursor)) : 1);
    s.g.style.opacity = op >= 0.995 ? '' : op.toFixed(3);
  });

  /* 进度弧与指示点也走连续位置 ⇒ 跟滑动一起动（逐帧驱动，所以 CSS 里不再挂 transition） */
  const deg = slotDeg(cursor);
  progEl.setAttribute('d', arcPath(-ARC, deg));
  const [kx, ky] = pt(deg);
  knobEl.setAttribute('transform', `translate(${kx.toFixed(2)},${ky.toFixed(2)})`);
}

/* ══ 平滑滚动：p 逐帧逼近 cur ══ */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
let raf = 0;
function step(){
  const d = cur - p;
  if (Math.abs(d) < 0.004){ p = cur; raf = 0; draw(); document.body.classList.remove('gliding'); return; }
  p += d * 0.24;                             // 指数缓动：约 8 帧走到 90%
  draw();
  raf = requestAnimationFrame(step);
}
function glide(){
  /* 跳太远（数字键换章 / 首尾回卷）就直接落位，别飞过整张表 */
  if (REDUCE || Math.abs(cur - p) > Math.max(4, V)){
    p = cur; draw(); document.body.classList.remove('gliding'); return;
  }
  if (!raf){ document.body.classList.add('gliding'); raf = requestAnimationFrame(step); }
}

/* 换节：右上整块换成这一节，再画一帧（滑过去的那段交给 glide 的逐帧）
   🆕 2026-09-25 用户：「给 rec 的节内容切换加个过渡」⇒ 换节时右栏整块淡入 + 轻微上移。
   两个细节：① 重触发动画要先移除 class、强制重排再加回来（否则同一次 class 不重播）；
            ② **快速连滚（<260ms）不重启动画**，免得连续换节时一闪一闪；REDUCE（系统开了"减少动态效果"）下不做。 */
let lastEnter = 0;
function paint(){
  renderSection(cur);
  draw();
  const core = document.getElementById('core');
  const now = performance.now();
  if (core && !REDUCE && now - lastEnter > 260){
    lastEnter = now;
    core.classList.remove('enter');
    void core.offsetWidth;                     // 强制重排 ⇒ 动画能重新开始
    core.classList.add('enter');
  }
}
function go(i){ const n = ((i % N) + N) % N; if (n === cur) return; cur = n; paint(); glide(); }

/* 折叠 / 展开：折起来只留一条边条 + 把手 */
const navBtn = document.getElementById('navtoggle');
function toggleNav(){
  const col = document.body.classList.toggle('nav-collapsed');
  navBtn.setAttribute('aria-expanded', String(!col));
  navBtn.textContent = col ? '⟩' : '⟨';
  navBtn.title = (col ? '展开' : '折叠') + '左侧弧（快捷键 E）';
}
navBtn.addEventListener('click', e => { e.stopPropagation(); toggleNav(); });
document.getElementById('navside').addEventListener('click', toggleNav);

/* 键盘：↑↓←→ 选条目 · 数字跳前九个 · E 折叠 */
addEventListener('keydown', e => {
  if (e.key === 'e' || e.key === 'E') { toggleNav(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  go(cur - 1);
  if (/^[1-9]$/.test(e.key) && +e.key <= N) go(+e.key - 1);
});

/* 上下滑动：滚轮 + 拖动（正文区自己滚得动时先让它滚，滚到头再换节） */
let lock = 0;
addEventListener('wheel', e => {
  const box = e.target && e.target.closest ? e.target.closest('.body') : null;
  if (box && !box.hidden && box.scrollHeight > box.clientHeight + 1){
    const atTop = box.scrollTop <= 0,
          atBot = box.scrollTop + box.clientHeight >= box.scrollHeight - 1;
    if ((e.deltaY > 0 && !atBot) || (e.deltaY < 0 && !atTop)) return;
  }
  if (Date.now() < lock || Math.abs(e.deltaY) < 3) return;
  lock = Date.now() + 200;
  go(cur + (e.deltaY > 0 ? 1 : -1));
}, { passive: true });

/* 拖动 = 连续换节；「点一下」= 选中点到的那条
   ⚠️ pointerdown 里的 setPointerCapture 会把随后的 click 重定向到 .arc 本身，
      ⇒ 挂在 <g> 上的 click 收不到（index 版「点了没反应」就是这么来的）。
      所以这里自己在 pointerup 里按坐标命中判定，不再指望 <g> 的 click。 */
const arcEl = document.getElementById('arc');
let dragging = false, dragY = 0, dragAcc = 0, dragMoved = 0;
const DRAG_STEP = 26;
arcEl.addEventListener('pointerdown', e => {
  /* ⚠️ 折叠后的「标题目录」边条（.nav-side）也在 #arc 里 —— 若不放行，
     下面的 setPointerCapture 会把 click 劫持到 #arc ⇒ 边条点不动（用户 2026-09-25 报的"navside 点不了"）。
     这和 <g> 收不到 click 是同一个机制，别删这条守卫。 */
  if (e.target.closest && e.target.closest('.navtoggle, .nav-side')) return;
  dragging = true; dragY = e.clientY; dragAcc = 0; dragMoved = 0;
  arcEl.classList.add('grab');
  try { if (arcEl.setPointerCapture) arcEl.setPointerCapture(e.pointerId); } catch (_) { /* 合成事件没有真 pointerId */ }
});
arcEl.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dy = e.clientY - dragY;
  dragY = e.clientY; dragAcc += dy; dragMoved += Math.abs(dy);
  while (dragAcc >= DRAG_STEP)  { dragAcc -= DRAG_STEP; go(cur - 1); }   // 往下拖 = 看上面的条目
  while (dragAcc <= -DRAG_STEP) { dragAcc += DRAG_STEP; go(cur + 1); }
});
arcEl.addEventListener('pointerup', e => {
  const wasClick = dragging && dragMoved < 5;                 // 几乎没动 ⇒ 当点击
  dragging = false; dragAcc = 0; arcEl.classList.remove('grab');
  if (!wasClick) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const g = hit && hit.closest ? hit.closest('.stick') : null;
  const i = g && g.dataset.i ? Number(g.dataset.i) : NaN;
  if (Number.isFinite(i)) go(i);
});
const endDrag = () => { dragging = false; dragAcc = 0; arcEl.classList.remove('grab'); };
arcEl.addEventListener('pointercancel', endDrag);

paint();
</script>
</body>
</html>
