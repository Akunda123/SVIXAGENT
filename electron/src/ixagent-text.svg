<svg id="f4dbe025-684f-4476-af7a-903efbcb8686" data-name="图层 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 557.2 100.69">
  <defs>
    <style>
      /* IX hover 文字：X 用 IX 蓝 #00AEFF，其余字母灰（低调不抢眼）
         1s 描边动画（重载即重放，hover 时 orb.html 用 ?v= 刷新 src）；X 蓝描边、其余灰描边 */
      .ix-letter {
        fill: #9ca3af;
        stroke: #9ca3af;
        stroke-width: 0.5px;
        animation: ixh-draw-g 1s ease-in forwards;
      }
      .ix-x {
        fill: #00AEFF;
        stroke: #00AEFF;
        stroke-width: 0.5px;
        animation: ixh-draw-b 1s ease-in forwards;
      }
      @keyframes ixh-draw-g {
        0%   { stroke-dasharray: 400; stroke-dashoffset: 400; fill: transparent; }
        45%  { stroke-dasharray: 400; stroke-dashoffset: 0; fill: transparent; }
        60%  { fill: #9ca3af; }
      }
      @keyframes ixh-draw-b {
        0%   { stroke-dasharray: 400; stroke-dashoffset: 400; fill: transparent; }
        45%  { stroke-dasharray: 400; stroke-dashoffset: 0; fill: transparent; }
        60%  { fill: #00AEFF; }
      }
      /* 逐字延迟（字母 2=X 排第二）：i1 x2 a3 i4 a5 g6 e7 n8 t9（内联 style 覆盖，见 path） */
    </style>
  </defs>
