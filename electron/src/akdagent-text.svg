<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 0 588 120">
  <!-- svagentlogo.svg 的文字部分（去掉左侧 SV 图标 monogram），hover 时显示在圆圈右侧
       带 1s 描边动画（每次重载重放），白字/绿 V 各自结尾填充色
       viewBox 底部留 20+ 余量：内容 y≈16..98，底部到 120，任何 g/y 下行部都不会被裁 -->
  <defs>
    <style>
      .a521413e-e102-405f-b609-e549612e3f65 {
        fill: #79d825;
        stroke: #79d825;
      }

      .a521413e-e102-405f-b609-e549612e3f65, .eefb8b64-4f07-4c80-82f7-acd28f36c10f, .f697a3d3-1e6e-47f1-bb5e-fab533f5809c {
        stroke-width: 0.5px;
      }

      .eefb8b64-4f07-4c80-82f7-acd28f36c10f, .f697a3d3-1e6e-47f1-bb5e-fab533f5809c {
        fill: #fff;
        stroke: #fff;
      }

      .b4bbc6ae-4f8f-466b-9a99-e6824cadd65d, .eefb8b64-4f07-4c80-82f7-acd28f36c10f {
        isolation: isolate;
        opacity: 0.7;
      }

      /* SVAgent：1s 描边动画（重载即重放）；白字与绿 V 结尾各自恢复填充色 */
      .f697a3d3-1e6e-47f1-bb5e-fab533f5809c {
        animation: svh-draw-w 1s ease-in forwards;
      }
      .a521413e-e102-405f-b609-e549612e3f65 {
        animation: svh-draw-g 1s ease-in forwards;
      }
      @keyframes svh-draw-w {
        0%   { stroke-dasharray: 400; stroke-dashoffset: 400; fill: transparent; }
        45%  { stroke-dasharray: 400; stroke-dashoffset: 0; fill: transparent; }
        60%  { fill: #fff; }
      }
      @keyframes svh-draw-g {
        0%   { stroke-dasharray: 400; stroke-dashoffset: 400; fill: transparent; }
        45%  { stroke-dasharray: 400; stroke-dashoffset: 0; fill: transparent; }
        60%  { fill: #79d825; }
      }
    </style>
  </defs>
