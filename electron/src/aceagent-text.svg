  <!-- ══ ACE 皮肤的 hover 文字图（#orb-label img，按 height:14px 显示）══
       来源：**用户自绘**（2026-10-03 提供 `Downloads\SVG\SVG\资源 123.svg`，Illustrator 默认导出名）。
       内容 = "ACE AI AGENT"；**第 1 个字母 A 是 #9087f6**（与 orb 标记里那个紫 a 同色），其余 9 个字白色 —— 照他原图的配色。
       ⚠️ 字形几何**一笔未改**（10 条 d 原样搬运）。
       ⚠️ 动画 = **SV/IX 同款**：逐字「描边描出 → 填充」，1s ease-in，延迟从 6ms 起每字 +7ms（原图 SV/IX 是 6/13/20ms）。
           dasharray = **浏览器量出来的真实长度 ×1.05**（见下面每行的 len→dash 注释）；换素材/改缩放必须重量。
           量法：把 path 塞进浏览器调 `path.getTotalLength()`（无头 Edge 截图读数字，见交接文档 §17.4）。
       槽位契约：文件名 electron/src/aceagent-text.svg · viewBox 高度与 SV/IX 同量级（~100）· 显示时 height:14px、宽度自适应
       ⚠️ XML 注释里**不许出现连续两个连字符**（踩过一次：整份 SVG 解析失败、图是空的）
       自查：node tools/check-ace-status.cjs -->
  <defs>
    <style>
