      @keyframes acet4 { 0% { fill: transparent; stroke: #fff; stroke-dasharray: 200px; stroke-dashoffset: 200px; } 20% { stroke-dashoffset: 0; } 30% { fill: transparent; } 50% { stroke: #fff; fill: #fff; } 100% { stroke: #fff; fill: #fff; } }
