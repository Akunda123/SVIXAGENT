      .ace-letter { stroke-linejoin: round; stroke-linecap: round; stroke-width: 0.5px; }
      .ace-violet { fill: #9087f6; stroke: #9087f6; }
      .ace-white { fill: #fff; stroke: #fff; }

      /*  0 "A" len=370 → dash=389 */
