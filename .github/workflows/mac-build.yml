# ============================================================================
# AKDAgent —— 在 GitHub 上出 macOS 版 .app（2026-09-25 立）
# ============================================================================
# 为什么放这儿做：
#   · 出 .app 必须有 macOS —— hdiutil / codesign / electron-builder 的 mac 目标都是 mac 专有
#   · GitHub 的 macOS runner 现在**只有 arm64**（macos-13 = Intel 已于 2025 年底退役）
#     ⇒ 本工作流出的是 **Apple Silicon（arm64）** 版，也正是 README 对外承诺的那个架构
#   · 公开仓库 ⇒ runner 分钟数免费；干净镜像不会踩本地那类
#     `ERR_ELECTRON_BUILDER_CANNOT_EXECUTE`（app-builder 二进制半装 / 被隔离）
#
# 两样输入：
#   ① 整包 mac-payload-arm64.zip —— 作为 release 资产放好（内含 dist/ dsh-runtime/ node tar.gz
#      这几个仓库里装不下的大件；仓库里只有源码）
#   ② 脚本 —— **一律取本仓库 checkout 的最新版覆盖整包里那份**
#      ⇒ 改了 mac-build.sh / build-mac.sh 之后**不需要重打整包**，重跑本工作流即可
#
# 产物：工作流 artifact ── AKDAgent-<版本>-arm64.zip / .dmg（+ dir-only 模式的 .app zip）
#       以及 mac-build.log（无论如何都传，排障全靠它）
# 触发：Actions → Build macOS app (arm64) → Run workflow；或 `gh workflow run`
# ============================================================================
name: Build macOS app (arm64)

on:
  workflow_dispatch:
    inputs:
      payload_url:
        description: '整包 zip 的下载地址（默认取 build-inputs release 上的 arm64 包）'
        required: false
        default: 'https://github.com/Akunda123/SVIXAGENT/releases/download/build-inputs/akdagent-mac-payload-arm64.zip'
      mode:
        description: '出包模式：dmg+zip = 完整发行件；dir-only = 只出 .app（快，用来先确认能跑）'
        required: true
        type: choice
        default: 'dmg+zip'
        options:
          - 'dmg+zip'
          - 'dir-only'
      release_tag:
        description: '（可选）把产物挂到这个已有的 release 标签上，例如 v1.0.0；留空则只留 artifact'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14          # arm64（macos-13 = Intel 已退役；见文件头）
    timeout-minutes: 90
    steps:
      - name: 取仓库（脚本以此为准）
        uses: actions/checkout@v4

      - name: 环境自述
        run: |
          sw_vers
          echo "架构：$(uname -m)"
          df -h /
          bash --version | head -1

      - name: 下载整包
        env:
          URL: ${{ inputs.payload_url }}
        run: |
          set -euo pipefail
          echo "整包：$URL"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 -o "$RUNNER_TEMP/payload.zip" "$URL"
          ls -lh "$RUNNER_TEMP/payload.zip"

      - name: 解开整包（--noqtn：不要把 quarantine 标记带进来）
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tree"
          ditto -x -k --noqtn "$RUNNER_TEMP/payload.zip" "$RUNNER_TEMP/tree"
          ls -la "$RUNNER_TEMP/tree"
          test -d "$RUNNER_TEMP/tree/electron"
          test -d "$RUNNER_TEMP/tree/dsh-runtime"
          test -d "$RUNNER_TEMP/tree/dist"
          # macOS runner 磁盘只有 14 GB：整包已解开，zip 留着没用（要重跑就重新下一次）
          df -h / | tail -1
          rm -f "$RUNNER_TEMP/payload.zip"

      - name: 用仓库里最新的脚本覆盖整包内的同名件
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tree"
          cp -f electron/scripts/mac-build-all.sh "$T/mac-build.sh"
          # ⚠️ 只同步**版本库里真的有的**源码目录。
          #   `dist/knowledge` 是脱敏生成的产物（不进 git）⇒ 用整包里那份，别去 rsync 它
          #   （2026-09-26 首次运行就栽在这：rsync 报 No such file or directory，exit 23）。
          # ⚠️ electron/src 与下面那几个**文件**必须一起覆盖：以前只覆盖目录 ⇒ mac 包用的是
          #    整包里那份旧客户端（版本号、凭据同步、诊断三件套全是旧的，2026-09-26 实测踩到）。
          # ⚠️ 2026-10-05 补 `licenses`：1.1.0 新增了 `licenses/acestudio-skills.LICENSE`（ACE 技能随包分发），
          #    而 `electron-builder.yml` 的 extraResources 里有 `../licenses` + `../THIRD-PARTY-NOTICES.md`
          #    —— 整包是**冻住**的 release 资产，不同步就会打成"缺新许可证"的包（或直接因缺文件失败）。
          for d in electron/src electron/scripts tools sv skills licenses; do
            if [ -d "$d" ]; then
              # ⚠️ 2026-10-06（复核抓到）：`electron/src/vendor/**` 是**客户端 PDF→PNG 渲染**要的 pdfjs min 构建，
              #    由 `tools/stage-pdfjs.cjs` 落位、被 `.gitignore` 挡住 ⇒ **仓库 checkout 里没有**。
              #    而这一步是拿 checkout 覆盖整包，`--delete` 会把整包里那份**删掉** ⇒ mac 版拖 PDF 直接失败，
              #    且链条上**没有任何检查会报红**。⇒ 同步 electron/src 时排除 vendor（保留整包里那份）。
              if [ "$d" = "electron/src" ]; then
                rsync -a --delete --exclude 'vendor/' "$d/" "$T/$d/"
              else
                rsync -a --delete "$d/" "$T/$d/"
              fi
              echo "  ✓ 同步 $d"
            else
              echo "  · 跳过 ${d}（仓库里没有这个目录）"
            fi
          done
          # 🆕 2026-10-05（ACE 技能随包分发的**真路径**）：App 启动时读的是 `<resources>/dsh/skills`
          #   （main.js：`skillsDir = path.join(dshRoot, 'skills')` → `DSH_BUNDLED_SKILL_DIR`），
          #   而 `dsh-runtime` 来自**冻住**的整包 ⇒ 不补这一步，ACE 那 7 个技能在 mac 包里**根本不存在**
          #   （Windows 侧 `build-runtime.ps1` 有"把仓库 skills 拷进运行时"这一步，mac-build 脚本没有）。
          #   ⚠️ 上面循环同步出来的 `$T/skills` **builder 并不读**（extraResources 只取 `../dsh-runtime/dsh`）。
          if [ -d "$T/dsh-runtime/dsh/skills" ]; then
            rsync -a --delete skills/ "$T/dsh-runtime/dsh/skills/"
            echo "  ✓ skills → dsh-runtime/dsh/skills（$(find "$T/dsh-runtime/dsh/skills" -name SKILL.md | wc -l | tr -d ' ') 个技能）"
          else
            echo "  · 跳过 skills → dsh-runtime/dsh/skills（整包里没有这个目录）"
          fi
          echo "覆盖后："          grep -c . "$T/mac-build.sh" | sed 's/^/  mac-build.sh 行数 /'
          echo "  与仓库版一致？ $(shasum -a 256 < "$T/mac-build.sh" | cut -c1-16) vs $(shasum -a 256 < electron/scripts/mac-build-all.sh | cut -c1-16)"
          ls -la "$T/electron/scripts/"
          # 决定版本号与打包配置的文件也要覆盖（否则 mac 包会一直是旧版本）
          # 🆕 2026-10-05 补 `THIRD-PARTY-NOTICES.md`：它是 extraResources 里的一项，1.1.0 改过内容。
          for f in electron/package.json electron/package-lock.json electron/electron-builder.yml THIRD-PARTY-NOTICES.md; do
            if [ -f "$f" ]; then
              cp -f "$f" "$T/$f"
              echo "  ✓ 覆盖 $f"
            else
              echo "  · 跳过 ${f}（仓库里没有）"
            fi
          done
          node -e "console.log(\"  electron 版本 = \" + require(\"./electron/package.json\").version)"

      - name: 用仓库里的 MCP server 覆盖整包里那份（server 代码 + 依赖都补齐）
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tree"
          # 为什么需要（2026-09-26 加）：整包里的 dist/server-runtime-darwin-<arch> 是**打包那天**的 server
          # 产物；仓库里的 server/ 后来又改过（例如 onnx 改懒加载），而整包是 release 资产、冻住的
          # ⇒ 不重新构建就会把**旧 server** 打进 mac 包。
          # ⛔ 2026-10-06 修（发布后核出的真缺口）：原先**只回填 dist/**、`node_modules` 仍用整包那份 ——
          #   而本轮新增的 5 个生产依赖（pdf-lib / pdfjs-dist / pngjs / jpeg-js / sharp ≈24 MB）在整包里**没有**
          #   ⇒ mac 版「内置识谱」调用时缺模块（好在它们全是动态 `await import` ⇒ server 仍能启动、其余工具正常）。
          #   ⇒ 改成**跑仓库自己的构建器**：它按 server/package.json 装齐生产依赖，并把 onnxruntime 裁到目标平台
          #     （与 Windows 侧同一套逻辑）。⛔ 别用 `npm install <缺的包>` 就地补 —— 那会把 onnxruntime-node
          #     的全平台二进制（258 MB）重新拉回来，dmg 直接涨 250 MB。
          npm ci --no-audit --no-fund --prefix server
          npm run build --prefix server
          for a in arm64 x64; do
            R="$T/dist/server-runtime-darwin-$a"
            if [ -d "$R/dist" ]; then
              EXTRA=""
              # Intel mac：onnxruntime-node 自 1.24 起不再发布 darwin/x64（上游 microsoft/onnxruntime#27961）⇒ 钉 1.23.2
              if [ "$a" = "x64" ]; then EXTRA="--onnx-version 1.23.2"; fi
              node tools/build-server-runtime.cjs --platform darwin --arch "$a" --no-models --out "$RUNNER_TEMP/srv-$a" $EXTRA
              # 只回填 dist/ 与 node_modules/：**models/ 保留整包那份**（模型在 .gitignore 里，checkout 拿不到）
              rsync -a --delete "$RUNNER_TEMP/srv-$a/dist/" "$R/dist/"
              rsync -a --delete "$RUNNER_TEMP/srv-$a/node_modules/" "$R/node_modules/"
              echo "  ✓ 已重建 ${a} 的 dist + node_modules（models 仍用整包那份）"
            fi
          done
          node -e "console.log('  server 版本 = ' + require('./server/package.json').version)"

      - name: 重新生成随包文档（脱敏）—— 整包里那份是冻住的
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tree"
          # 🆕 2026-10-05：`electron-builder.yml` 的 extraResources 取 `../dist/knowledge`（脱敏副本），
          #   而整包是**打包那天**的 release 资产 ⇒ 不重新生成，mac 包里带的离线文档/缺陷表就是旧版。
          #   真源 = 仓库里的 `knowledge/docs` + `tools`（都随 checkout 拿到最新版）。
          # ⚠️ 目标**直接指到树里**（`$T/dist/knowledge`）：既不必在 checkout 里落一份中间产物，
          #   也不会踩 `tools/check-ci-workflow.cjs` 那条"CI 不许把仓库侧 `dist/` 当同步源"的红线
          #   （它挡的正是 2026-09-26 那次 rsync exit 23 的真事故）。
          # ⚠️ 必须 `--clean`：不清会留着上一次的幽灵副本，脚本只会**警告**、不会报错。
          node tools/check-redaction.cjs --redact-to "$T/dist/knowledge" --clean
          echo "  放进树里：$(find "$T/dist/knowledge" -type f | wc -l | tr -d ' ') 个文件"

      - name: 出包（bash mac-build.sh）
        run: |
          set -o pipefail
          T="$RUNNER_TEMP/tree"
          ARGS=""
          if [ "${{ inputs.mode }}" = "dir-only" ]; then ARGS="--dir"; fi
          echo "模式：${{ inputs.mode }}　参数：${ARGS:-（无）}"
          cd "$T"
          if bash mac-build.sh $ARGS; then
            echo "✓ mac-build.sh 结束（返回 0）"
          else
            echo "::error::mac-build.sh 返回非 0"
            echo "----- mac-build.log 尾部 -----"
            tail -n 120 "$T/mac-build.log" 2>/dev/null || echo "（没有日志）"
            exit 1
          fi
          echo "----- 日志尾部（含自检段）-----"
          tail -n 45 "$T/mac-build.log" || true
          echo "----- release 目录 -----"
          ls -lh "$T/electron/release" || true

      - name: dir-only 模式：把 .app 压成 zip（否则 artifact 装目录很别扭）
        if: inputs.mode == 'dir-only'
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/tree/electron/release/mac-arm64"
          ls -la "$D"
          ditto -c -k --keepParent "$D/AKDAgent.app" "$RUNNER_TEMP/tree/electron/release/AKDAgent-app-only-arm64.zip"
          ls -lh "$RUNNER_TEMP/tree/electron/release"

      - name: 校验产物（清单 + sha256）
        if: always()
        run: |
          set -o pipefail
          D="$RUNNER_TEMP/tree/electron/release"
          echo "== $D =="
          ls -lh "$D" 2>/dev/null || true
          for f in "$D"/AKDAgent-*.zip "$D"/AKDAgent-*.dmg; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f"
          done

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AKDAgent-mac-arm64
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/tree/electron/release/AKDAgent-*.zip
            ${{ runner.temp }}/tree/electron/release/AKDAgent-*.dmg

      - name: 上传日志（无论如何）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/tree/mac-build.log

      - name: （可选）挂到已有 release
        if: success() && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/tree/electron/release"
          shopt -s nullglob
          FILES=("$D"/AKDAgent-*.zip "$D"/AKDAgent-*.dmg)
          if [ ${#FILES[@]} -eq 0 ]; then echo "！没有 dmg/zip（dir-only 模式？）⇒ 跳过"; exit 0; fi
          # ⚠️ 变量后面**必须**用 ${}**：macOS bash 3.2 + 非 UTF-8 locale 会把紧跟的中文吞进变量名
          #    （2026-09-26 实测：`${TAG}：` ⇒ `TAG?: unbound variable`；与当初 `${label}：` 同一个坑）
          echo "挂到 release ${TAG}：${FILES[*]}"
          gh release upload "${TAG}" "${FILES[@]}" --clobber -R "${GITHUB_REPOSITORY}"
          echo "✓ 已挂上（带 --clobber ⇒ 同一个 tag 重出包会**覆盖**旧资产；2026-10-06 修口径：mac 包重出必须能覆盖）"
